[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "figgen"
version = "0.1.0"
description = "YAMLの仕様1枚から説明図を出す。配置はレイアウトエンジンではなく人が決める。"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "onosh" }]
keywords = ["diagram", "figure", "yaml", "swimlane", "slides", "mcp", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Presentation",
  "Natural Language :: Japanese",
]

# Chrome / Edge は pip では入らない。入っていなければ `python doctor.py` が場所を教える。
dependencies = ["pyyaml>=6.0", "pillow>=9.0"]

# MCP サーバーだけ Python 3.10 以上が要る（mcp SDK の要件）。
# 本体は 3.9 で動くので、必須依存にはしない。
[project.optional-dependencies]
mcp = ["mcp>=2.0"]

[project.urls]
Homepage = "https://github.com/littlechama/figgen"
Issues = "https://github.com/littlechama/figgen/issues"

[project.scripts]
figgen = "figgen.cli:main"
figgen-mcp = "figgen.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

# theme.css は figgen の見た目そのもの。同梱しないと図が素のHTMLになる。
# BLOCKS.md は YAML方言の正本で、MCP の figgen_blocks がこれを返す
[tool.setuptools.package-data]
figgen = ["theme.css", "BLOCKS.md"]
